<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}"></title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

<div class="container text-center mt-5">

    <h3 class="mb-3">Thanh toán đơn hàng <span class="text-primary" th:text="${order.orderCode}"></span></h3>
    <p>Số tiền cần thanh toán:</p>
    <h2 class="text-danger fw-bold" th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')}"></h2>

    <img th:src="${qrUrl}" alt="QR thanh toán" class="img-fluid mt-3" width="320">

    <p class="mt-3">Quét QR bằng App MBBank, Vietcombank, Vietin, BIDV, v.v...</p>

    <div class="alert alert-warning mt-4">
        Sau khi thanh toán, hệ thống sẽ tự động cập nhật trạng thái đơn hàng!
    </div>

</div>
<div class="text-center mt-4">

    <!-- Loader xoay xoay -->
    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
        <span class="visually-hidden">Loading...</span>
    </div>

    <p class="mt-3 fs-5 fw-semibold text-secondary">
        Đang chờ bạn thanh toán...
    </p>

    <!-- Countdown -->
    <p class="text-danger fw-bold fs-6">
        Thời gian còn lại: <span id="countdown">15:00</span>
    </p>

</div>
<script>
    const orderId = [[${order.id}]];
    let timeLeft = 15 * 60; // 15 phút

    // ---------------------------------------
    // 1️⃣ COUNTDOWN 15 PHÚT
    // ---------------------------------------
    function updateCountdown() {
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;

        document.getElementById("countdown").textContent =
            `${minutes}:${seconds < 10 ? '0' + seconds : seconds}`;

        if (timeLeft <= 0) {
            // Tự động hủy đơn khi hết giờ
            window.location.href = "/orders/expired?orderId=" + orderId;
        }

        timeLeft--;
    }

    setInterval(updateCountdown, 1000); // chạy mỗi giây


    // ---------------------------------------
    // 2️⃣ KIỂM TRA TRẠNG THÁI ĐƠN HÀNG TỪ BACKEND
    // ---------------------------------------
    function checkPaymentStatus() {
        fetch(`/api/order/status/${orderId}`)
            .then(res => res.text())
            .then(status => {
                console.log("Order status:", status);

                if (status === "PAID") {
                    // thanh toán thành công => chuyển trang
                    window.location.href = "/orders/success";
                }

                if (status === "Cancelled" || status === "Expired") {
                    window.location.href = "/orders/failed";
                }
            })
            .catch(err => console.error("Error checking payment:", err));
    }

    // Auto check mỗi 3 giây
    setInterval(checkPaymentStatus, 3000);
</script>


</body>
</html>
